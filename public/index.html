<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Telegram 图床上传</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 2rem;
        color: #1f2933;
      }
      .card {
        max-width: 520px;
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        padding: 1.5rem;
      }
      label {
        display: block;
        margin-top: 1rem;
      }
      button {
        margin-top: 1rem;
        padding: 0.5rem 1rem;
        border-radius: 8px;
        border: none;
        background: #2563eb;
        color: #fff;
        cursor: pointer;
      }
      pre {
        white-space: pre-wrap;
        word-break: break-all;
        background: #f9fafb;
        padding: 1rem;
        border-radius: 8px;
        margin-top: 1rem;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Telegram 图床上传</h1>
      <p>选择文件上传到 Telegram 频道，并获得可访问链接。</p>
      <form id="upload-form">
        <label>
          选择文件：
          <input type="file" name="file" required />
        </label>
        <label>
          <input type="checkbox" name="document" />
          使用 sendDocument（保留原图）
        </label>
        <button type="submit">上传</button>
      </form>
      <pre id="result">等待上传...</pre>
    </div>

    <script>
      const form = document.getElementById('upload-form');
      const result = document.getElementById('result');

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        result.textContent = '上传中...';

        const formData = new FormData(form);
        const useDocument = formData.get('document');

        if (useDocument) {
          formData.delete('document');
        }

        const url = useDocument ? '/upload?document=1' : '/upload';
        const response = await fetch(url, {
          method: 'POST',
          body: formData,
        });

        const data = await response.json();
        result.textContent = JSON.stringify(data, null, 2);
      });
    </script>
  </body>
</html>
